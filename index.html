<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07112b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:," />
    <title>Frame It: Live Sports TV</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div class="vf tl"></div><div class="vf tr"></div><div class="vf bl"></div><div class="vf br"></div>
      <div class="cross"></div>

      <div class="bug">
        <span class="live">LIVE</span>
        <span class="team"><i id="c0"></i><b id="t0"></b></span>
        <span id="score" class="score">0 - 0</span>
        <span class="team"><b id="t1"></b><i id="c1"></i></span>
        <span id="clock" class="clock">0'</span>
      </div>

      <div class="rec"><i></i>REC</div>
      <div id="pts" class="pts">0 PT</div>
      <div id="fps" class="fps"></div>

      <div id="voice" class="voice hidden"><span class="tag" data-i18n="REGIA">DIRECTOR</span><span id="voice-text"></span><u id="voice-bar"></u></div>

      <div id="zoom" class="zoom">x1.0</div>
      <div id="hint" class="hint">
        <span class="hint-pointer" data-i18n="Trascina per inquadrare · Rotella per zoomare · E/+ avvicina · Q/− allontana">Drag to frame · Wheel to zoom · E/+ zoom in · Q/− zoom out</span>
        <span class="hint-touch" data-i18n="Trascina per inquadrare · Pizzica o tieni premuto +/− per zoomare">Drag to frame · Pinch or hold +/− to zoom</span>
      </div>
      <div id="result" class="result hidden"></div>
    </div>

    <div id="zoomctl" class="hidden"><button id="zin" data-i18n-aria="Avvicina: E o più" data-i18n-title="Avvicina (E o +)" aria-label="Zoom in: E or plus" title="Zoom in (E or +)">+</button><button id="zout" data-i18n-aria="Allontana: Q o meno" data-i18n-title="Allontana (Q o −)" aria-label="Zoom out: Q or minus" title="Zoom out (Q or −)">−</button></div>

    <div id="start" class="overlay">
      <div class="logo">FRAME IT<small>LIVE SPORTS TV</small></div>
      <p class="tag" data-i18n="Live Sports &amp; Arcade Camera Game">Live Sports &amp; Arcade Camera Game</p>
      <div id="language-picker" class="language-picker"><label for="language" data-i18n="Lingua">Language</label><select id="language"></select></div>
      <div id="sports" class="sports"></div>
      <p class="cta" data-i18n="Tocca per iniziare">Tap to start</p>
      <button id="album-btn" class="ghost" data-i18n="Album clip rare">Rare highlights album</button>
    </div>

    <div id="album" class="overlay hidden"></div>

    <div id="replay" class="hidden">
      <div class="rp-bar top"></div><div class="rp-bar bottom"></div>
      <div class="rp-wipe"><span>REPLAY</span></div>
      <div class="rp-tag"><b>REPLAY</b><span id="rp-speed">x0.6</span></div>
      <div class="rp-skip" data-i18n="Tocca per saltare">Tap to skip</div>
    </div>

    <div id="summary" class="overlay hidden"></div>

    <div id="rotate" class="overlay" data-i18n="Ruota il telefono in orizzontale">Rotate your phone to landscape</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
